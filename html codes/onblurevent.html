<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function myFunction() {
            var x=document.form1.fname;
            x.value=x.value.toUpperCase();
        }
    </script>
</head>
<body>
   <form name="form1">
     Enter your name: <input type="text" name="fname" onblur="myFunction()">
</form>
 <p>
    when you leave the input field, the text will be converted to uppercase.
 </p>   
</body>
</html>
